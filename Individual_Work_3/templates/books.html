{% extends "base.html" %}
{% block title %}Каталог книг{% endblock %}
{% block content %}
<h2>Каталог книг</h2>
<div class="books-grid">
    {% for book in books %}
    <div class="book-card">
        <h3>{{ book.title }}</h3>
        <p>Автор: {{ book.author }}</p>
        <p>Жанр: {{ book.genre }}</p>
        <p class="price">{{ book.price }} грн</p>
        <a href="{{ url_for('book_detail', book_id=book.id) }}" class="btn">Детальніше</a>
    </div>
    {% endfor %}
</div>
{% endblock %}

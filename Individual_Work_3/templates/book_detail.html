{% extends "base.html" %}
{% block title %}{{ book.title }}{% endblock %}
{% block content %}
<h2>{{ book.title }}</h2>
<p><strong>Автор:</strong> {{ book.author }}</p>
<p><strong>Жанр:</strong> {{ book.genre }}</p>
<p><strong>ISBN:</strong> {{ book.isbn }}</p>
<p><strong>Наявність:</strong> {{ book.stock }} шт.</p>
<p class="price" style="font-size: 24px;">{{ book.price }} грн</p>

<form method="POST" action="{{ url_for('add_to_cart', book_id=book.id) }}">
    <button type="submit" class="btn">🛒 Додати до кошика</button>
</form>
<br>
<a href="{{ url_for('book_list') }}">← Повернутися до каталогу</a>
{% endblock %}
